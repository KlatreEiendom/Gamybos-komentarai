<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamybos užsakymo lapai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #f5f4f0;
    --card: #ffffff;
    --card-border: #e5e3dc;
    --divider: #f2f0eb;
    --ink: #111111;
    --text: #1a1a1a;
    --muted: #888888;
    --muted-2: #999999;
    --accent: #1D9E75;
    --chip-bg: #f0ede6;
    --danger: #c0524a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }

  /* ================= PROJECT LIST VIEW ================= */
  .list-wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 3rem; }
  .list-head {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .list-head h1 { font-size: 1.05rem; font-weight: 700; color: var(--ink); margin: 0; }
  .list-head p { font-size: 0.8rem; color: var(--muted); margin: 3px 0 0; }
  .new-project-btn {
    font-family: inherit; font-size: 0.82rem; font-weight: 600; padding: 10px 18px;
    border-radius: 8px; border: none; background: var(--ink); color: #fff; cursor: pointer;
    white-space: nowrap; transition: background .15s;
  }
  .new-project-btn:hover { background: #333; }

  .project-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .project-card:hover { border-color: #cfcabd; box-shadow: 0 2px 10px rgba(20,20,20,.05); }
  .project-card .pc-main { flex: 1; min-width: 0; }
  .project-card .pc-title { font-size: 0.92rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project-card .pc-title.untitled { color: #b9b4a8; font-weight: 500; font-style: normal; }
  .project-card .pc-meta { font-size: 0.74rem; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .project-card .pc-chip {
    background: var(--chip-bg); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 1px 9px; font-size: 0.68rem; color: var(--muted-2); white-space: nowrap;
  }
  .project-card .pc-del {
    border: none; background: transparent; color: #ccc; font-size: 1rem; cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%; flex: none; transition: background .15s, color .15s;
  }
  .project-card .pc-del:hover { background: #f3ebe9; color: var(--danger); }

  .list-empty {
    text-align: center; padding: 48px 20px; color: var(--muted); font-size: 0.86rem;
    background: var(--card); border: 1px dashed var(--card-border); border-radius: 12px;
  }
  .list-empty .new-project-btn { margin-top: 14px; }

  /* ================= TOOLBAR (sheet editor) ================= */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    padding: 14px clamp(12px, 3vw, 28px);
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 0.9rem; font-weight: 600; color: var(--ink); margin: 0 auto 0 0; }
  .toolbar button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    color: #333;
    cursor: pointer;
    transition: background .15s;
  }
  .toolbar button:hover { background: var(--paper); }
  .toolbar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar button.primary:hover { background: #333; }
  .toolbar button.back-btn { border-color: transparent; background: transparent; padding: 8px 10px 8px 4px; color: #555; }
  .toolbar button.back-btn:hover { color: var(--ink); background: transparent; }
  .toolbar .save-hint { font-size: 0.72rem; color: var(--muted); width: 100%; order: 99; margin-top: 2px; }

  /* ================= SHEET ================= */
  .sheet-wrap { display: flex; justify-content: center; padding: 2rem 1rem 140px; }
  .sheet { width: 100%; max-width: 900px; }

  .box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    position: relative;
  }

  .header-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .header-box { min-height: 90px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px 20px; }
  #titleBox { font-size: clamp(1.15rem, 2.4vw, 1.4rem); font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  [contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [data-ph]:empty:before { content: attr(data-ph); color: #b9b4a8; font-weight: 400; font-size: 0.9rem; letter-spacing: normal; }

  /* ---- pagrindinė medžiaga (multi-select) ---- */
  .spec-box { flex-direction: column; gap: 8px; padding: 16px 20px; }
  .spec-chips-wrap {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
  }
  .spec-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip-bg); border: 1px solid var(--card-border); border-radius: 20px;
    font-size: 0.78rem; font-weight: 600; color: var(--accent);
    padding: 4px 8px 4px 12px; white-space: nowrap;
  }
  .spec-chip .rm { cursor: pointer; color: #bbb; font-size: 0.78rem; transition: color .15s; }
  .spec-chip .rm:hover { color: var(--danger); }
  .spec-empty { font-size: 0.85rem; color: #b9b4a8; }
  .spec-picker { position: relative; }

  .pairs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 640px) { .header-row, .pairs-grid { grid-template-columns: 1fr; } }

  .full-stack .box { margin-bottom: 16px; }

  .box-title-row {
    background: #faf9f6;
    border-bottom: 1px solid var(--divider);
    padding: 12px 16px;
    font-weight: 600;
    text-align: left;
    text-transform: uppercase;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--ink);
    border-radius: 12px 12px 0 0;
  }

  /* ---- laiptų tipas (single-select list w/ add-new, inside the Laiptai box) ---- */
  .type-picker-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--divider);
  }
  .type-picker-label { font-size: 0.72rem; color: var(--muted); }
  .type-picker-wrap { position: relative; margin-left: auto; }
  .type-select-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 0.82rem; font-weight: 600; color: var(--accent);
    padding: 7px 11px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer;
    transition: border-color .15s;
  }
  .type-select-btn:hover { border-color: #bbb; }
  .type-select-btn.placeholder { color: #b9b4a8; font-weight: 400; }
  .type-select-btn .caret {
    font-size: 0.6rem; color: #999; line-height: 1; transition: transform .15s; transform: rotate(0deg);
  }
  .type-select-btn.open .caret { transform: rotate(180deg); }

  .stair-type-opt {
    font-size: 0.82rem; color: #333; padding: 7px 8px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .stair-type-opt:before { content: ''; width: 6px; height: 6px; border-radius: 50%; border: 1px solid #ccc; flex: none; }
  .stair-type-opt:hover { background: var(--paper); }
  .stair-type-opt.selected { font-weight: 600; color: var(--accent); }
  .stair-type-opt.selected:before { background: var(--accent); border-color: var(--accent); }
  .stair-type-opt.none-opt { color: var(--muted); font-style: italic; }
  .stair-type-opt.none-opt.selected { color: var(--accent); }
  .stair-type-opt.add-new {
    margin-top: 6px; padding-top: 9px; border-top: 1px solid var(--divider);
    color: var(--muted); font-weight: 500;
  }
  .stair-type-opt.add-new:before { display: none; }
  .stair-type-opt.add-new:hover { color: var(--accent); }

  .popover-add-row {
    display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--divider);
  }
  .popover-add-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 0.78rem;
    padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; outline: none;
  }
  .popover-add-input:focus { border-color: var(--accent); }
  .popover-add-btn {
    font-family: inherit; font-size: 0.85rem; font-weight: 600; width: 30px; flex: none;
    border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer;
  }
  .popover-add-btn:hover { background: #333; }

  /* ---- taip/ne pasirinkimas (pvz. dažymo abi pusės): vienas mygtukas,
     rodo tik pasirinktą reikšmę, paspaudus iškleidžia sąrašą su kitu variantu ---- */
  .yesno-select-btn.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .yesno-select-btn.yes .caret { color: #fff; }
  .yesno-select-btn.no { background: var(--danger); border-color: var(--danger); color: #fff; }
  .yesno-select-btn.no .caret { color: #fff; }

  /* ---- dažymo eilutė: spalva kairėje, detalės dešinėje ---- */
  .paint-color-wrap { position: relative; flex: 0 0 auto; padding: 9px 4px 9px 16px; }
  .blanks-area.paint-details { flex: 1 1 auto; max-width: none; }

  .line-row { display: flex; align-items: flex-start; border-bottom: 1px solid var(--divider); transition: background .1s; }
  .line-row:last-child { border-bottom: none; }
  .line-row:hover { background: #faf9f6; }
  .line-text { flex: 1 1 auto; min-width: 0; padding: 9px 16px; font-size: 0.82rem; line-height: 1.45; color: #222; }
  .line-text[data-ph]:empty:before { font-size: 0.82rem; }

  /* ---- ruošiniai tag picker on the right edge of a line ---- */
  .blanks-area {
    position: relative;
    flex: 0 0 auto;
    max-width: 46%;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: flex-end;
    gap: 5px;
    padding: 7px 10px 7px 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--chip-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--muted-2);
    padding: 2px 8px 2px 10px;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip .rm { cursor: pointer; color: #bbb; font-size: 0.72rem; flex: none; transition: color .15s; }
  .chip .rm:hover { color: var(--danger); }
  .blanks-toggle {
    border: 1px solid #ddd;
    background: var(--paper);
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 500;
    padding: 3px 11px;
    color: #555;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .blanks-toggle:hover { background: #ececE6; color: var(--ink); }
  .blanks-popover {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 12px;
    min-width: 210px;
    max-width: 280px;
    max-height: 240px;
    overflow-y: auto;
    box-shadow: 0 10px 24px rgba(20,20,20,.12);
    z-index: 30;
    text-align: left;
  }
  .blanks-popover.open { display: block; }
  .blanks-popover .grp-title {
    font-size: 0.66rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 6px 0 3px;
  }
  .blanks-popover .grp-title:first-child { margin-top: 0; }
  .blanks-popover label {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 0.8rem;
    color: #333;
    padding: 4px 2px;
    cursor: pointer;
    line-height: 1.3;
    border-radius: 6px;
  }
  .blanks-popover label:hover { background: var(--paper); }
  .blanks-popover input[type=checkbox] { accent-color: var(--accent); margin-top: 2px; cursor: pointer; }
  .blanks-popover .empty-msg { font-size: 0.76rem; color: var(--muted); padding: 4px 2px; }

  .del-line {
    border: none;
    background: transparent;
    color: #bbb;
    font-size: 0.95rem;
    width: 26px;
    cursor: pointer;
    opacity: 0;
    align-self: stretch;
    transition: color .15s;
  }
  .del-line:hover { color: var(--danger); }
  .line-row:hover .del-line, .line-row:focus-within .del-line { opacity: 1; }

  .add-line {
    display: block; width: 100%; text-align: left; padding: 9px 16px;
    font-size: 0.76rem; font-weight: 500; color: var(--muted); background: transparent; border: none;
    border-top: 1px solid var(--divider); cursor: pointer; font-family: inherit; transition: color .15s;
  }
  .add-line:hover { color: var(--accent); }

  .del-section {
    position: absolute; top: 10px; right: 10px; width: 22px; height: 22px;
    border-radius: 50%; border: 1px solid var(--card-border); background: #fff; color: var(--muted-2);
    font-size: 0.75rem; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .1s, color .15s;
  }
  .del-section:hover { color: var(--danger); }
  .box:hover .del-section { opacity: 1; }

  .notes-box .notes-area { padding: 14px 16px; min-height: 130px; font-size: 0.85rem; line-height: 1.6; color: #222; white-space: pre-wrap; }

  .add-section-bar { display: flex; gap: 8px; justify-content: center; margin: 18px 0 4px; }
  .add-section-bar button {
    font-family: inherit; font-size: 0.76rem; font-weight: 500; padding: 8px 16px; border: 1px dashed #ccc;
    background: transparent; color: var(--muted); border-radius: 20px; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .add-section-bar button:hover { color: var(--ink); border-color: var(--ink); }

  @media print {
    .toolbar, .add-line, .del-line, .del-section, .add-section-bar, .blanks-toggle, .blanks-popover, .chip .rm, .spec-picker, .spec-chip .rm { display: none !important; }
    body { background: #fff; }
    .sheet-wrap { padding: 0; }
    .sheet { max-width: 100%; }
    .box { border: 0.5px solid #ccc; border-radius: 8px; }
    [contenteditable]:focus { outline: none; }
    [data-ph]:empty:before { content: '' !important; }
    .chip { padding: 2px 8px; background: #f0f0f0 !important; }
    #projectListView { display: none !important; }
    .type-select-btn { border: none !important; padding: 0 !important; background: none !important; color: #111 !important; }
    .type-select-btn.placeholder { color: #999 !important; }
    .type-select-btn .caret { display: none !important; }
  }
</style>
</head>
<body>

<!-- ================= PROJECT LIST VIEW ================= -->
<div id="projectListView">
  <div class="list-wrap">
    <div class="list-head">
      <div>
        <h1>Gamybos užsakymo lapai</h1>
        <p>Pasirinkite anksčiau sukurtą projektą arba sukurkite naują</p>
      </div>
      <button class="new-project-btn" type="button" id="newProjectBtn">+ Naujas projektas</button>
    </div>
    <div id="projectsContainer"></div>
  </div>
</div>

<!-- ================= SHEET EDITOR VIEW ================= -->
<div id="sheetView" style="display:none;">

  <div class="toolbar">
    <button class="back-btn" id="backBtn" type="button">← Projektai</button>
    <h1>Gamybos užsakymo lapas</h1>
    <button id="addPairBtn" type="button">+ Skiltis (2 stulp.)</button>
    <button id="addListBtn" type="button">+ Eilučių blokas</button>
    <button id="clearBtn" type="button">Išvalyti lapą</button>
    <button id="printBtn" class="primary" type="button">Spausdinti</button>
    <div class="save-hint">Duomenys saugomi automatiškai šioje naršyklėje. Kiekvienai detalės eilutei dešinėje galite pažymėti, kokie ruošiniai jai naudojami (galima kelis).</div>
  </div>

  <div class="sheet-wrap">
    <div class="sheet" id="sheet">
      <div class="header-row">
        <div class="box header-box" id="titleBox" contenteditable="true" data-ph="Projekto pavadinimas"></div>
        <div class="box header-box spec-box">
          <div class="spec-chips-wrap" id="specChips"></div>
          <div class="spec-picker">
            <button class="blanks-toggle" type="button" id="specAddBtn">+ pasirinkti medžiagą</button>
          </div>
        </div>
      </div>

      <div class="pairs-grid" id="pairsGrid"></div>
      <div class="full-stack" id="fullStack"></div>

      <div class="box notes-box">
        <div class="box-title-row">Papildoma informacija</div>
        <div class="notes-area" id="notesArea" contenteditable="true" data-ph="Papildomos pastabos gamybai..."></div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  var INDEX_KEY = 'gamybos-projektai-index';
  var PROJECT_KEY_PREFIX = 'gamybos-projektas-';
  var LEGACY_KEY = 'gamybos-lapas-v4'; // single-sheet storage from an earlier version

  var MATERIAL_OPTIONS = [
    'Dygiuotas ąžuolas – 40/38/20 mm',
    'Dygiuotas uosis – 40/20 mm',
    'Ąžuolo masyvas – 40/20 mm',
    'Uosio masyvas – 40/20 mm'
  ];

  // Shared, editable option lists for the dropdown fields inside the
  // Laiptai box. Adding a new value while editing one project makes it
  // available in every other project too (stored outside any one project).
  function loadTypeList(key, defaults){
    try {
      var raw = localStorage.getItem(key);
      var arr = raw ? JSON.parse(raw) : null;
      return Array.isArray(arr) && arr.length ? arr : defaults.slice();
    } catch(e) { return defaults.slice(); }
  }
  function saveTypeList(key, arr){
    try { localStorage.setItem(key, JSON.stringify(arr)); }
    catch(e) { /* storage unavailable — continue without persistence */ }
  }

  // Every dropdown always offers this as its first option, so a detail
  // that genuinely doesn't exist on this project can be marked as such —
  // distinct from just not having picked anything yet.
  var NONE_OPTION = '-';
  function ensureNoneFirst(key, arr){
    var idx = arr.indexOf(NONE_OPTION);
    if(idx === -1){ arr.unshift(NONE_OPTION); saveTypeList(key, arr); }
    else if(idx !== 0){ arr.splice(idx, 1); arr.unshift(NONE_OPTION); saveTypeList(key, arr); }
    return arr;
  }

  var STAIR_TYPES_KEY = 'gamybos-laiptu-tipai';
  var DEFAULT_STAIR_TYPES = [
    NONE_OPTION,
    'Sijos iš šonų',
    'Sijos iš apačios',
    'Metalo sija'
  ];
  var STAIR_TYPE_OPTIONS = ensureNoneFirst(STAIR_TYPES_KEY, loadTypeList(STAIR_TYPES_KEY, DEFAULT_STAIR_TYPES));

  var BASE_TYPES_KEY = 'gamybos-statramsciu-tipai';
  var DEFAULT_BASE_TYPES = [
    NONE_OPTION,
    'D28x28',
    'Ø16',
    'Ø22',
    '4+4 stiklas',
    '5+5 stiklas',
    '6+6 stiklas',
    '8+8 stiklas'
  ];
  var BASE_TYPE_OPTIONS = loadTypeList(BASE_TYPES_KEY, DEFAULT_BASE_TYPES);
  // Make sure the glass options are present even for a list saved before
  // they were added, so existing projects get them without losing anything.
  ['4+4 stiklas', '5+5 stiklas', '6+6 stiklas', '8+8 stiklas'].forEach(function(v){
    if(BASE_TYPE_OPTIONS.indexOf(v) === -1) BASE_TYPE_OPTIONS.push(v);
  });
  saveTypeList(BASE_TYPES_KEY, BASE_TYPE_OPTIONS);
  BASE_TYPE_OPTIONS = ensureNoneFirst(BASE_TYPES_KEY, BASE_TYPE_OPTIONS);

  var STEP_TYPES_KEY = 'gamybos-pakopu-tipai';
  var DEFAULT_STEP_TYPES = [
    NONE_OPTION,
    'Uždaros pakopos su nosele',
    'Uždaros pakopos be noselės',
    'Atviros pakopos L-formos'
  ];
  var STEP_TYPE_OPTIONS = ensureNoneFirst(STEP_TYPES_KEY, loadTypeList(STEP_TYPES_KEY, DEFAULT_STEP_TYPES));

  var HANDRAIL_TYPES_KEY = 'gamybos-porankiu-tipai';
  var DEFAULT_HANDRAIL_TYPES = [
    NONE_OPTION,
    '38x60',
    '40x60',
    '38x80',
    '40x80'
  ];
  var HANDRAIL_TYPE_OPTIONS = ensureNoneFirst(HANDRAIL_TYPES_KEY, loadTypeList(HANDRAIL_TYPES_KEY, DEFAULT_HANDRAIL_TYPES));

  var POST_TYPES_KEY = 'gamybos-stulpu-tipai';
  var DEFAULT_POST_TYPES = [
    NONE_OPTION,
    'S80x80',
    '38x80',
    '40x80'
  ];
  var POST_TYPE_OPTIONS = ensureNoneFirst(POST_TYPES_KEY, loadTypeList(POST_TYPES_KEY, DEFAULT_POST_TYPES));

  // Dažymas box: each line pairs one paint color with the detail(s) that
  // get painted in it. Both option lists are shared/editable like the
  // Laiptai/Balkonas type dropdowns above.
  var PAINT_COLOR_KEY = 'gamybos-dazymo-spalvos';
  var DEFAULT_PAINT_COLORS = [
    NONE_OPTION,
    'Panna Cotta',
    'BTX 1473',
    'C5',
    'Be apdailos'
  ];
  var PAINT_COLOR_OPTIONS = loadTypeList(PAINT_COLOR_KEY, DEFAULT_PAINT_COLORS);
  // Make sure this option is present even for a list saved before it was added.
  if(PAINT_COLOR_OPTIONS.indexOf('Be apdailos') === -1) PAINT_COLOR_OPTIONS.push('Be apdailos');
  saveTypeList(PAINT_COLOR_KEY, PAINT_COLOR_OPTIONS);
  PAINT_COLOR_OPTIONS = ensureNoneFirst(PAINT_COLOR_KEY, PAINT_COLOR_OPTIONS);

  var PAINT_DETAIL_KEY = 'gamybos-dazymo-detales';
  var DEFAULT_PAINT_DETAILS = [
    'Pakopos',
    'Porankiai',
    'Tvorelė',
    'Stulpeliai',
    'Statramsčiai',
    'Sijos'
  ];
  var PAINT_DETAIL_OPTIONS = loadTypeList(PAINT_DETAIL_KEY, DEFAULT_PAINT_DETAILS);
  saveTypeList(PAINT_DETAIL_KEY, PAINT_DETAIL_OPTIONS);

  function newPairLine(text){ return { text: text || '', blanks: [] }; }
  function newPaintLine(){ return { color: '', details: [] }; }

  function blankProjectState(){
    return {
      title: '',
      specMaterials: [],
      pairs: [
        { title: 'Laiptai', stairType: '', baseType: '', stepType: '', handrailType: '', postType: '', lines: [ newPairLine('') ] },
        { title: 'Balkonas', baseType: '', handrailType: '', postType: '', lines: [ newPairLine('') ] }
      ],
      lists: [
        { title: 'Ruošiniai', lines: [''] },
        { title: 'Dažymas', lines: [ newPaintLine() ], bothSides: false }
      ],
      notes: ''
    };
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ============== storage: projects index ============== */
  function loadIndex(){
    try {
      var raw = localStorage.getItem(INDEX_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveIndex(idx){
    try { localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); }
    catch(e) { /* storage unavailable — continue without persistence */ }
  }
  function loadProjectState(id){
    try {
      var raw = localStorage.getItem(PROJECT_KEY_PREFIX + id);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }
  function saveProjectState(id, st){
    try { localStorage.setItem(PROJECT_KEY_PREFIX + id, JSON.stringify(st)); }
    catch(e) { /* storage unavailable — continue without persistence */ }
  }
  function deleteProjectState(id){
    try { localStorage.removeItem(PROJECT_KEY_PREFIX + id); }
    catch(e) { /* ignore */ }
  }

  // One-time migration: an earlier version of this page stored a single
  // sheet under LEGACY_KEY. If that exists and no project index exists yet,
  // turn it into the first project so nothing already filled in is lost.
  (function migrateLegacy(){
    var idx = loadIndex();
    if(idx.length > 0) return;
    var raw;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch(e){ raw = null; }
    if(!raw) return;
    var legacy;
    try { legacy = JSON.parse(raw); } catch(e){ return; }
    if(!legacy || typeof legacy !== 'object') return;
    var id = uid();
    var st = blankProjectState();
    st.title = typeof legacy.title === 'string' ? legacy.title : '';
    st.specMaterials = Array.isArray(legacy.specMaterials) ? legacy.specMaterials :
      (typeof legacy.spec === 'string' && legacy.spec.trim() ? [legacy.spec.trim()] : []);
    if(Array.isArray(legacy.pairs) && legacy.pairs.length) st.pairs = legacy.pairs;
    if(Array.isArray(legacy.lists) && legacy.lists.length) st.lists = legacy.lists;
    st.notes = typeof legacy.notes === 'string' ? legacy.notes : '';
    migrate(st);
    saveProjectState(id, st);
    idx.push({ id: id, title: st.title, updatedAt: Date.now() });
    saveIndex(idx);
  })();

  // Upgrade older saved project states where pair lines were plain strings.
  function migrate(s){
    if(!Array.isArray(s.specMaterials)) s.specMaterials = [];
    (s.pairs || []).forEach(function(p){
      if(/laiptai/i.test(p.title || '')){
        if(typeof p.stairType !== 'string') p.stairType = '';
        if(typeof p.baseType !== 'string') p.baseType = '';
        if(typeof p.stepType !== 'string') p.stepType = '';
        if(typeof p.handrailType !== 'string') p.handrailType = '';
        if(typeof p.postType !== 'string') p.postType = '';
      }
      if(/balkon/i.test(p.title || '')){
        if(typeof p.baseType !== 'string') p.baseType = '';
        if(typeof p.handrailType !== 'string') p.handrailType = '';
        if(typeof p.postType !== 'string') p.postType = '';
      }
      p.lines = (p.lines || []).map(function(l){
        if(typeof l === 'string') return newPairLine(l);
        if(l && typeof l === 'object'){
          if(!Array.isArray(l.blanks)) l.blanks = [];
          if(typeof l.text !== 'string') l.text = '';
          return l;
        }
        return newPairLine('');
      });
      if(p.lines.length === 0) p.lines.push(newPairLine(''));
    });
    (s.lists || []).forEach(function(l){
      var isDazymas = /dažym|dazym/i.test(l.title || '');
      if(isDazymas){
        l.lines = (l.lines || []).map(function(item){
          if(item && typeof item === 'object'){
            if(typeof item.color !== 'string') item.color = '';
            if(!Array.isArray(item.details)) item.details = [];
            return item;
          }
          if(typeof item === 'string' && item.trim()) return { color: item.trim(), details: [] };
          return newPaintLine();
        });
        if(l.lines.length === 0) l.lines.push(newPaintLine());
        if(typeof l.bothSides !== 'boolean') l.bothSides = false;
      } else {
        if(l.lines.length === 0) l.lines.push('');
      }
    });
  }

  function fmtDate(ts){
    var d = new Date(ts);
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function countFilled(st){
    var n = 0;
    (st.pairs || []).forEach(function(p){ (p.lines||[]).forEach(function(l){ if((l.text||'').trim()) n++; }); });
    (st.lists || []).forEach(function(l){ (l.lines||[]).forEach(function(t){ if((t||'').trim()) n++; }); });
    return n;
  }

  /* ============== project list view ============== */
  function renderProjectList(){
    var idx = loadIndex().slice().sort(function(a, b){ return b.updatedAt - a.updatedAt; });
    var container = document.getElementById('projectsContainer');
    container.innerHTML = '';

    if(idx.length === 0){
      var empty = el('div', {class:'list-empty'});
      empty.appendChild(el('div', {text:'Dar nėra sukurtų projektų'}));
      var btn = el('button', {class:'new-project-btn', type:'button', text:'+ Naujas projektas'});
      btn.addEventListener('click', createNewProject);
      empty.appendChild(btn);
      container.appendChild(empty);
      return;
    }

    idx.forEach(function(entry){
      var card = el('div', {class:'project-card'});
      var main = el('div', {class:'pc-main'});
      var titleText = (entry.title || '').trim();
      main.appendChild(el('div', {class: 'pc-title' + (titleText ? '' : ' untitled'), text: titleText || 'Be pavadinimo'}));

      var meta = el('div', {class:'pc-meta'});
      meta.appendChild(el('span', {text: 'Atnaujinta ' + fmtDate(entry.updatedAt)}));
      var st = loadProjectState(entry.id);
      if(st){
        var filled = countFilled(st);
        meta.appendChild(el('span', {class:'pc-chip', text: filled + ' įrašyti punktai'}));
        if(st.specMaterials && st.specMaterials.length){
          meta.appendChild(el('span', {class:'pc-chip', text: st.specMaterials.length === 1 ? st.specMaterials[0] : st.specMaterials.length + ' medžiagos'}));
        }
      }
      main.appendChild(meta);
      card.appendChild(main);

      var del = el('button', {class:'pc-del', type:'button', title:'Šalinti projektą', text:'×'});
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        if(!confirm('Ištrinti projektą' + (titleText ? ' „' + titleText + '“' : '') + '? Šio veiksmo atšaukti negalima.')) return;
        deleteProjectState(entry.id);
        var idx2 = loadIndex().filter(function(e){ return e.id !== entry.id; });
        saveIndex(idx2);
        renderProjectList();
      });
      card.appendChild(del);

      card.addEventListener('click', function(){ openProject(entry.id); });
      container.appendChild(card);
    });
  }

  function createNewProject(){
    var id = uid();
    var st = blankProjectState();
    saveProjectState(id, st);
    var idx = loadIndex();
    idx.push({ id: id, title: '', updatedAt: Date.now() });
    saveIndex(idx);
    openProject(id);
  }

  document.getElementById('newProjectBtn').addEventListener('click', createNewProject);

  /* ============== sheet editor ============== */
  var currentProjectId = null;
  var state = null;
  var openPopoverId = null;

  function touchIndexEntry(){
    if(!currentProjectId) return;
    var idx = loadIndex();
    var found = false;
    idx.forEach(function(e){
      if(e.id === currentProjectId){
        e.title = state.title || '';
        e.updatedAt = Date.now();
        found = true;
      }
    });
    if(!found) idx.push({ id: currentProjectId, title: state.title || '', updatedAt: Date.now() });
    saveIndex(idx);
  }

  function save(){
    if(!currentProjectId) return;
    saveProjectState(currentProjectId, state);
    touchIndexEntry();
  }

  function showListView(){
    document.getElementById('projectListView').style.display = '';
    document.getElementById('sheetView').style.display = 'none';
    currentProjectId = null;
    renderProjectList();
  }

  function openProject(id){
    var st = loadProjectState(id);
    if(!st){ st = blankProjectState(); saveProjectState(id, st); }
    migrate(st);
    currentProjectId = id;
    state = st;
    document.getElementById('projectListView').style.display = 'none';
    document.getElementById('sheetView').style.display = '';
    window.scrollTo(0, 0);
    renderAll();
  }

  document.getElementById('backBtn').addEventListener('click', showListView);

  // Groups of selectable raw-material options, one group per "list" section.
  function getBlankGroups(){
    var groups = (state.lists || [])
      .filter(function(l){ return !/dažym|dazym/i.test(l.title || ''); })
      .map(function(l){
        return {
          title: (l.title || '').trim() || 'Be pavadinimo',
          options: (l.lines || []).map(function(t){ return t.trim(); }).filter(Boolean)
        };
      })
      .filter(function(g){ return g.options.length > 0; });
    groups.sort(function(a, b){
      var ar = /ruoš|ruos/i.test(a.title) ? 0 : 1;
      var br = /ruoš|ruos/i.test(b.title) ? 0 : 1;
      return ar - br;
    });
    return groups;
  }

  function closeAllPopovers(){
    document.querySelectorAll('.blanks-popover.open').forEach(function(p){ p.classList.remove('open'); });
    document.querySelectorAll('.type-select-btn.open').forEach(function(b){ b.classList.remove('open'); });
    openPopoverId = null;
  }
  document.addEventListener('click', function(e){
    if(!e.target.closest('.blanks-area, .type-picker-wrap')) closeAllPopovers();
  });

  function renderChips(area, lineObj){
    area.querySelectorAll('.chip').forEach(function(c){ c.remove(); });
    var toggle = area.querySelector('.blanks-toggle');
    lineObj.blanks.forEach(function(val, i){
      var chip = el('div', {class:'chip'});
      var span = el('span', {text: val});
      var rm = el('span', {class:'rm', title:'Šalinti', text:'×'});
      rm.addEventListener('click', function(ev){
        ev.stopPropagation();
        lineObj.blanks.splice(i, 1);
        renderChips(area, lineObj);
        refreshPopoverChecks(area, lineObj);
        save();
      });
      chip.appendChild(span);
      chip.appendChild(rm);
      area.insertBefore(chip, toggle);
    });
  }

  function refreshPopoverChecks(area, lineObj){
    var pop = area.querySelector('.blanks-popover');
    if(!pop) return;
    pop.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.checked = lineObj.blanks.indexOf(cb.value) !== -1;
    });
  }

  function buildPopover(lineObj, area){
    var pop = el('div', {class:'blanks-popover'});
    var groups = getBlankGroups();
    if(groups.length === 0){
      pop.appendChild(el('div', {class:'empty-msg', text:'Pridėkite eilučių į "Ruošiniai" bloką, kad galėtumėte jas čia pasirinkti.'}));
      return pop;
    }
    groups.forEach(function(g){
      pop.appendChild(el('div', {class:'grp-title', text: g.title}));
      g.options.forEach(function(opt){
        var label = el('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = opt;
        cb.checked = lineObj.blanks.indexOf(opt) !== -1;
        cb.addEventListener('change', function(){
          var idx = lineObj.blanks.indexOf(opt);
          if(cb.checked && idx === -1) lineObj.blanks.push(opt);
          if(!cb.checked && idx !== -1) lineObj.blanks.splice(idx, 1);
          renderChips(area, lineObj);
          save();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(opt));
        pop.appendChild(label);
      });
    });
    return pop;
  }

  function makeBlanksArea(lineObj, popId){
    var area = el('div', {class:'blanks-area'});
    var toggle = el('button', {class:'blanks-toggle', type:'button', text:'+ ruošinys'});
    var pop = buildPopover(lineObj, area);
    toggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = pop.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        // rebuild in case Ruošiniai list changed since last render
        var fresh = buildPopover(lineObj, area);
        pop.replaceWith(fresh);
        pop = fresh;
        pop.classList.add('open');
      }
    });
    area.appendChild(pop);
    area.appendChild(toggle);
    renderChips(area, lineObj);
    return area;
  }

  function renderSpecChips(){
    var wrap = document.getElementById('specChips');
    wrap.innerHTML = '';
    if(state.specMaterials.length === 0){
      wrap.appendChild(el('span', {class:'spec-empty', text:'Pagrindinė medžiaga nepasirinkta'}));
      return;
    }
    state.specMaterials.forEach(function(val, i){
      var chip = el('div', {class:'spec-chip'});
      chip.appendChild(el('span', {text: val}));
      var rm = el('span', {class:'rm', title:'Šalinti', text:'×'});
      rm.addEventListener('click', function(ev){
        ev.stopPropagation();
        state.specMaterials.splice(i, 1);
        renderSpecChips();
        refreshSpecPopoverChecks();
        save();
      });
      chip.appendChild(rm);
      wrap.appendChild(chip);
    });
  }

  var specPopoverEl = null;

  function refreshSpecPopoverChecks(){
    if(!specPopoverEl) return;
    specPopoverEl.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.checked = state.specMaterials.indexOf(cb.value) !== -1;
    });
  }

  function buildSpecPopover(){
    var pop = el('div', {class:'blanks-popover'});
    var materials = (state && state.specMaterials) || [];
    MATERIAL_OPTIONS.forEach(function(opt){
      var label = el('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = opt;
      cb.checked = materials.indexOf(opt) !== -1;
      cb.addEventListener('change', function(){
        var idx = state.specMaterials.indexOf(opt);
        if(cb.checked && idx === -1) state.specMaterials.push(opt);
        if(!cb.checked && idx !== -1) state.specMaterials.splice(idx, 1);
        renderSpecChips();
        save();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(opt));
      pop.appendChild(label);
    });
    return pop;
  }

  function initSpecPicker(){
    var picker = document.querySelector('.spec-picker');
    var toggle = document.getElementById('specAddBtn');
    specPopoverEl = buildSpecPopover();
    picker.appendChild(specPopoverEl);
    toggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = specPopoverEl.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        var fresh = buildSpecPopover();
        specPopoverEl.replaceWith(fresh);
        specPopoverEl = fresh;
        specPopoverEl.classList.add('open');
      }
    });
  }
  document.addEventListener('click', function(e){
    if(specPopoverEl && specPopoverEl.classList.contains('open') && !e.target.closest('.spec-picker')){
      specPopoverEl.classList.remove('open');
    }
  });
  initSpecPicker();

  // Generic single-select dropdown w/ an editable, shared option list.
  // fieldKey is the property on sectionData holding the current value.
  // optionsArray is one of the shared *_TYPE_OPTIONS arrays (mutated in
  // place and persisted to storageKey so new entries stick around).
  // onSwap(addMode) rebuilds the popover in place (list mode, or the
  // "type a new one" mode) and keeps it open, without closing the dropdown.
  function buildTypeOptionsPopover(sectionData, fieldKey, optionsArray, storageKey, onSwap, addMode){
    var pop = el('div', {class:'blanks-popover'});

    if(addMode){
      var addRow = el('div', {class:'popover-add-row'});
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Įrašykite naują variantą...';
      input.className = 'popover-add-input';
      var addBtn = el('button', {type:'button', class:'popover-add-btn', text:'+'});
      function confirmAdd(){
        var val = input.value.trim();
        if(!val) return;
        if(optionsArray.indexOf(val) === -1){
          optionsArray.push(val);
          saveTypeList(storageKey, optionsArray);
        }
        sectionData[fieldKey] = val;
        closeAllPopovers();
        renderAll();
        save();
      }
      addBtn.addEventListener('click', function(ev){ ev.stopPropagation(); confirmAdd(); });
      input.addEventListener('click', function(ev){ ev.stopPropagation(); });
      input.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ ev.preventDefault(); confirmAdd(); }
        if(ev.key === 'Escape'){ ev.preventDefault(); onSwap(false); }
      });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      pop.appendChild(addRow);
      setTimeout(function(){ input.focus(); }, 0);
      return pop;
    }

    optionsArray.forEach(function(opt){
      var cls = 'stair-type-opt';
      if(sectionData[fieldKey] === opt) cls += ' selected';
      if(opt === NONE_OPTION) cls += ' none-opt';
      var item = el('div', {class: cls, text: typeDisplayLabel(opt)});
      item.addEventListener('click', function(){
        sectionData[fieldKey] = (sectionData[fieldKey] === opt) ? '' : opt;
        closeAllPopovers();
        renderAll();
        save();
      });
      pop.appendChild(item);
    });

    var addOpt = el('div', {class:'stair-type-opt add-new', text:'+ Naujas variantas...'});
    addOpt.addEventListener('click', function(ev){ ev.stopPropagation(); onSwap(true); });
    pop.appendChild(addOpt);

    return pop;
  }

  // Builds one "Label: [ dropdown ▾ ]" row and appends it to box.
  function typeDisplayLabel(val){
    return val === NONE_OPTION ? '– nėra –' : val;
  }

  function appendTypePickerRow(box, sectionData, fieldKey, label, placeholder, optionsArray, storageKey){
    if(typeof sectionData[fieldKey] !== 'string') sectionData[fieldKey] = '';
    var row = el('div', {class:'type-picker-row'});
    row.appendChild(el('span', {class:'type-picker-label', text: label}));

    var wrap = el('div', {class:'type-picker-wrap'});
    function swap(addMode){
      var fresh = buildTypeOptionsPopover(sectionData, fieldKey, optionsArray, storageKey, swap, addMode);
      pop.replaceWith(fresh);
      pop = fresh;
      pop.classList.add('open');
    }
    var pop = buildTypeOptionsPopover(sectionData, fieldKey, optionsArray, storageKey, swap, false);
    var toggle = el('button', {
      class: 'type-select-btn' + (sectionData[fieldKey] ? '' : ' placeholder'),
      type: 'button'
    });
    toggle.appendChild(el('span', {text: sectionData[fieldKey] ? typeDisplayLabel(sectionData[fieldKey]) : placeholder}));
    toggle.appendChild(el('span', {class:'caret', text:'▾'}));
    toggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = pop.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        swap(false);
        toggle.classList.add('open');
      }
    });
    wrap.appendChild(pop);
    wrap.appendChild(toggle);
    row.appendChild(wrap);
    box.appendChild(row);
  }

  // Taip/Ne dropdown row (e.g. "ar yra detalių, kurios matosi iš abiejų
  // pusių?" in the Dažymas box). fieldKey holds true/false directly on
  // sectionData. Shown as a single button with the CURRENT value only
  // (colored green/red), same "click to open a short list" pattern as the
  // other type dropdowns — so nobody mistakes an unselected option for
  // the chosen one.
  function appendYesNoRow(box, sectionData, fieldKey, label){
    if(typeof sectionData[fieldKey] !== 'boolean') sectionData[fieldKey] = false;
    var row = el('div', {class:'type-picker-row'});
    row.appendChild(el('span', {class:'type-picker-label', text: label}));

    var wrap = el('div', {class:'type-picker-wrap'});
    var pop = el('div', {class:'blanks-popover'});
    [ {label:'Taip', val:true}, {label:'Ne', val:false} ].forEach(function(opt){
      var cls = 'stair-type-opt';
      if(sectionData[fieldKey] === opt.val) cls += ' selected';
      var item = el('div', {class: cls, text: opt.label});
      item.addEventListener('click', function(){
        sectionData[fieldKey] = opt.val;
        closeAllPopovers();
        renderAll();
        save();
      });
      pop.appendChild(item);
    });

    var toggle = el('button', {
      class: 'type-select-btn yesno-select-btn ' + (sectionData[fieldKey] ? 'yes' : 'no'),
      type: 'button'
    });
    toggle.appendChild(el('span', {text: sectionData[fieldKey] ? 'Taip' : 'Ne'}));
    toggle.appendChild(el('span', {class:'caret', text:'▾'}));
    toggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = pop.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        pop.classList.add('open');
        toggle.classList.add('open');
      }
    });
    wrap.appendChild(pop);
    wrap.appendChild(toggle);
    row.appendChild(wrap);
    box.appendChild(row);
  }

  function makePairLineRow(lines, idx){
    var lineObj = lines[idx];
    var row = el('div', {class:'line-row'});
    var text = el('div', {class:'line-text', contenteditable:'true', 'data-ph':'įrašykite detalę...'});
    text.textContent = lineObj.text;
    text.addEventListener('input', function(){ lineObj.text = text.textContent; save(); });
    row.appendChild(text);
    row.appendChild(makeBlanksArea(lineObj));
    var del = el('button', {class:'del-line', type:'button', title:'Šalinti eilutę', text:'×'});
    del.addEventListener('click', function(){
      lines.splice(idx, 1);
      if(lines.length === 0) lines.push(newPairLine(''));
      renderAll();
    });
    row.appendChild(del);
    return row;
  }

  // ---- Dažymas paint-color rows: left = color dropdown, right = multi-select of details ----
  function renderPaintDetailChips(area, lineObj){
    area.querySelectorAll('.chip').forEach(function(c){ c.remove(); });
    var toggle = area.querySelector('.blanks-toggle');
    lineObj.details.forEach(function(val, i){
      var chip = el('div', {class:'chip'});
      chip.appendChild(el('span', {text: val}));
      var rm = el('span', {class:'rm', title:'Šalinti', text:'×'});
      rm.addEventListener('click', function(ev){
        ev.stopPropagation();
        lineObj.details.splice(i, 1);
        renderPaintDetailChips(area, lineObj);
        save();
      });
      chip.appendChild(rm);
      area.insertBefore(chip, toggle);
    });
  }

  function buildPaintDetailsPopover(lineObj, area){
    var pop = el('div', {class:'blanks-popover'});
    if(PAINT_DETAIL_OPTIONS.length === 0){
      pop.appendChild(el('div', {class:'empty-msg', text:'Nėra apibrėžtų detalių.'}));
      return pop;
    }
    PAINT_DETAIL_OPTIONS.forEach(function(opt){
      var label = el('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = opt;
      cb.checked = lineObj.details.indexOf(opt) !== -1;
      cb.addEventListener('change', function(){
        var idx = lineObj.details.indexOf(opt);
        if(cb.checked && idx === -1) lineObj.details.push(opt);
        if(!cb.checked && idx !== -1) lineObj.details.splice(idx, 1);
        renderPaintDetailChips(area, lineObj);
        save();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(opt));
      pop.appendChild(label);
    });
    return pop;
  }

  function makePaintDetailsArea(lineObj){
    var area = el('div', {class:'blanks-area paint-details'});
    var toggle = el('button', {class:'blanks-toggle', type:'button', text:'+ detalė'});
    var pop = buildPaintDetailsPopover(lineObj, area);
    toggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = pop.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        var fresh = buildPaintDetailsPopover(lineObj, area);
        pop.replaceWith(fresh);
        pop = fresh;
        pop.classList.add('open');
      }
    });
    area.appendChild(pop);
    area.appendChild(toggle);
    renderPaintDetailChips(area, lineObj);
    return area;
  }

  function makePaintLineRow(lines, idx){
    var lineObj = lines[idx];
    var row = el('div', {class:'line-row paint-line-row'});

    var colorWrap = el('div', {class:'type-picker-wrap paint-color-wrap'});
    function swapColor(addMode){
      var fresh = buildTypeOptionsPopover(lineObj, 'color', PAINT_COLOR_OPTIONS, PAINT_COLOR_KEY, swapColor, addMode);
      colorPop.replaceWith(fresh);
      colorPop = fresh;
      colorPop.classList.add('open');
    }
    var colorPop = buildTypeOptionsPopover(lineObj, 'color', PAINT_COLOR_OPTIONS, PAINT_COLOR_KEY, swapColor, false);
    var colorToggle = el('button', {
      class: 'type-select-btn' + (lineObj.color ? '' : ' placeholder'),
      type: 'button'
    });
    colorToggle.appendChild(el('span', {text: lineObj.color ? typeDisplayLabel(lineObj.color) : 'Pasirinkti spalvą'}));
    colorToggle.appendChild(el('span', {class:'caret', text:'▾'}));
    colorToggle.addEventListener('click', function(ev){
      ev.stopPropagation();
      var isOpen = colorPop.classList.contains('open');
      closeAllPopovers();
      if(!isOpen){
        swapColor(false);
        colorToggle.classList.add('open');
      }
    });
    colorWrap.appendChild(colorPop);
    colorWrap.appendChild(colorToggle);
    row.appendChild(colorWrap);

    row.appendChild(makePaintDetailsArea(lineObj));

    var del = el('button', {class:'del-line', type:'button', title:'Šalinti eilutę', text:'×'});
    del.addEventListener('click', function(){
      lines.splice(idx, 1);
      if(lines.length === 0) lines.push(newPaintLine());
      renderAll();
    });
    row.appendChild(del);
    return row;
  }

  function makeListLineRow(lines, idx){
    var row = el('div', {class:'line-row'});
    var text = el('div', {class:'line-text', contenteditable:'true', 'data-ph':'įrašykite...'});
    text.textContent = lines[idx] || '';
    text.addEventListener('input', function(){ lines[idx] = text.textContent; save(); });
    var del = el('button', {class:'del-line', type:'button', title:'Šalinti eilutę', text:'×'});
    del.addEventListener('click', function(){
      lines.splice(idx, 1);
      if(lines.length === 0) lines.push('');
      renderAll();
    });
    row.appendChild(text);
    row.appendChild(del);
    return row;
  }

  function renderBox(sectionData, onDeleteSection, isPair){
    var box = el('div', {class:'box'});
    if(onDeleteSection){
      var delSec = el('button', {class:'del-section', type:'button', title:'Šalinti skiltį', text:'×'});
      delSec.addEventListener('click', onDeleteSection);
      box.appendChild(delSec);
    }
    var titleRow = el('div', {class:'box-title-row', contenteditable:'true', 'data-ph':'Pavadinimas'});
    titleRow.textContent = sectionData.title || '';
    titleRow.addEventListener('input', function(){ sectionData.title = titleRow.textContent; save(); });
    box.appendChild(titleRow);

    var isLaiptaiBox = isPair && /laiptai/i.test(sectionData.title || '');
    var isBalkonasBox = isPair && /balkon/i.test(sectionData.title || '');
    if(isLaiptaiBox){
      appendTypePickerRow(box, sectionData, 'stairType', 'Laiptų tipas:', 'Pasirinkti tipą', STAIR_TYPE_OPTIONS, STAIR_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'baseType', 'Tvorelės tipas:', 'Pasirinkti tipą', BASE_TYPE_OPTIONS, BASE_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'stepType', 'Pakopų tipas:', 'Pasirinkti tipą', STEP_TYPE_OPTIONS, STEP_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'handrailType', 'Porankių tipas:', 'Pasirinkti tipą', HANDRAIL_TYPE_OPTIONS, HANDRAIL_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'postType', 'Stulpų tipas:', 'Pasirinkti tipą', POST_TYPE_OPTIONS, POST_TYPES_KEY);
    } else if(isBalkonasBox){
      appendTypePickerRow(box, sectionData, 'baseType', 'Tvorelės tipas:', 'Pasirinkti tipą', BASE_TYPE_OPTIONS, BASE_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'handrailType', 'Porankių tipas:', 'Pasirinkti tipą', HANDRAIL_TYPE_OPTIONS, HANDRAIL_TYPES_KEY);
      appendTypePickerRow(box, sectionData, 'postType', 'Stulpų tipas:', 'Pasirinkti tipą', POST_TYPE_OPTIONS, POST_TYPES_KEY);
    }

    var isDazymasBox = !isPair && /dažym|dazym/i.test(sectionData.title || '');
    if(isDazymasBox){
      appendYesNoRow(box, sectionData, 'bothSides', 'Ar yra detalių, kurios matosi iš abiejų pusių?');
    }

    var linesWrap = el('div', {class:'lines'});
    sectionData.lines.forEach(function(_, idx){
      var rowEl;
      if(isDazymasBox) rowEl = makePaintLineRow(sectionData.lines, idx);
      else if(isPair) rowEl = makePairLineRow(sectionData.lines, idx);
      else rowEl = makeListLineRow(sectionData.lines, idx);
      linesWrap.appendChild(rowEl);
    });
    box.appendChild(linesWrap);

    var addLine = el('button', {class:'add-line', type:'button', text: isDazymasBox ? '+ spalva' : '+ eilutė'});
    addLine.addEventListener('click', function(){
      sectionData.lines.push(isDazymasBox ? newPaintLine() : (isPair ? newPairLine('') : ''));
      renderAll();
      focusLastLine(box);
    });
    box.appendChild(addLine);
    return box;
  }

  function focusLastLine(box){
    var rows = box.querySelectorAll('.line-text');
    if(rows.length) rows[rows.length - 1].focus();
  }

  function renderAll(){
    var titleBox = document.getElementById('titleBox');
    if(titleBox.textContent !== state.title) titleBox.textContent = state.title;
    renderSpecChips();

    var pairsGrid = document.getElementById('pairsGrid');
    pairsGrid.innerHTML = '';
    state.pairs.forEach(function(p, i){
      pairsGrid.appendChild(renderBox(p, function(){
        state.pairs.splice(i, 1);
        renderAll(); save();
      }, true));
    });

    var fullStack = document.getElementById('fullStack');
    fullStack.innerHTML = '';
    state.lists.forEach(function(l, i){
      fullStack.appendChild(renderBox(l, function(){
        state.lists.splice(i, 1);
        renderAll(); save();
      }, false));
    });

    var notesArea = document.getElementById('notesArea');
    if(notesArea.textContent !== state.notes) notesArea.textContent = state.notes;
  }

  document.getElementById('titleBox').addEventListener('input', function(){ state.title = this.textContent; save(); });
  document.getElementById('notesArea').addEventListener('input', function(){ state.notes = this.textContent; save(); });

  document.getElementById('addPairBtn').addEventListener('click', function(){
    state.pairs.push({ title: '', lines: [ newPairLine('') ] });
    renderAll(); save();
  });
  document.getElementById('addListBtn').addEventListener('click', function(){
    state.lists.push({ title: '', lines: [''] });
    renderAll(); save();
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!confirm('Išvalyti šio projekto lapą? Duomenys šiame projekte bus pakeisti tuščiais.')) return;
    state = blankProjectState();
    renderAll(); save();
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  // Start on the project list.
  renderProjectList();
})();
</script>
